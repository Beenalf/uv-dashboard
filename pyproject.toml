[project]
name = "uv-dose"
version = "0.1.0"
description = "Desktop UV dose calculator for Australian cities using ARPANSA UV data: SED over any time window, Fitzpatrick skin type, burn and vitamin D timing."
readme = "README.md"
authors = [
    { name = "beenalf", email = "167204635+Beenalf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Held below 3.11: matplotlib 3.11.2 lays out text about 5x slower (about 7 ms per label
    # against 1.5 ms on 3.10), which made every chart redraw take a third of a second.
    "matplotlib>=3.10.9,<3.11",
    # matplotlib 3.10 converts dates with a NumPy feature deprecated in NumPy 2.5 (it warns
    # now and is due to become an error), so NumPy is held with it. Lift both together.
    "numpy<2.6",
    # Draws the window's rounded widgets (uv_dose/gui/theme.py); matplotlib needs it too.
    "pillow>=10",
]

[project.scripts]
uv-dose = "uv_dose.__main__:main"

[project.gui-scripts]
uv-dose-gui = "uv_dose.__main__:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: talks to the live ARPANSA API (deselect with -m 'not network')",
]
